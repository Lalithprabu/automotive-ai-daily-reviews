# Full-scale TrajFusionNet+ config (matches the base TrajFusionNet's
# verified dims: d_model=128, past_len=15, future_len=60). GAM dims are a
# good-faith reconstruction (see src/models/gam.py's sourcing note).
sam:
  past_len: 15
  future_len: 60
  traj_channels: 5
  d_model: 128
  traj_enc_layers: 8
  traj_dec_layers: 8
  traj_heads: 4
  traj_ffn_dim: 512
  cls_layers: 6
  cls_heads: 8
  cls_ffn_dim: 1024
  proj_dim: 40
  dropout: 0.1

vam:
  in_channels: 3
  base_channels: 32
  num_stages: 3
  proj_dim: 40
  dropout: 0.1

gam:
  node_feat_dim: 8
  d_model: 128
  num_heads: 4
  num_layers: 2
  proj_dim: 40
  dropout: 0.1
  max_nodes: 16

fusion_hidden_dim: 60
dropout: 0.1

train:
  batch_size: 16
  lr: 0.0001
  steps: 200
  cls_loss_weight: 1.0
  traj_loss_weight: 1.0
  seed: 0
