# All values are this repo's reconstruction defaults unless SOURCING.md says otherwise.
seed: 7
model: {d: 128, heads: 4, layers: 2, ff: 256}
lora: {r: 4, alpha: 8.0}          # paper: r = 8 on a 121M model; r=4 here keeps the payload ratio meaningful at d=128
data: {num_clients: 20, n_train: 160, n_val: 40, own_frac: 0.7, pretrain_n: 4000}
pretrain: {epochs: 25, lr: 0.001, batch_size: 64}
federated:
  rounds: 30
  batch_size: 32
  lr_lora: 0.003                   # LoRA conventionally tolerates a larger LR
  lr_full: 0.001
  local_epochs_lora: [1, 5]        # the paper's F = 1 and F = 5 (F=2 omitted for CPU time)
  local_epochs_full: 1
centralized: {epochs: 30, lr: 0.001, batch_size: 64}
comm: {assumed_uplink_mbps: 10.0}  # ASSUMPTION; paper uses a 3GPP TS 38.306 peak-rate model
target_ade_slack: 1.65              # POST-HOC: "good enough" = within 65% of centralized ADE (no run reached 1.05x); chosen after seeing curves
