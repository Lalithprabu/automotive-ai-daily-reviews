# All values are this repo's own reconstruction defaults unless SOURCING.md says otherwise.
seed: 7
data:
  n_train: 6000        # per class-balanced pool (LLC / LK / RLC each n_train/3)
  n_val: 1500
  n_test_per_horizon: 1500
  train_horizons: [0.5, 4.5]   # lane-change samples drawn uniformly from this horizon range (s)
  eval_horizons: [1.0, 2.0, 3.0, 4.0]
model:
  dim: 100             # TransE embedding size (precursor paper: 100)
  gamma: 6.0           # margin
  adv_temp: 1.0        # self-adversarial sampling temperature
train:
  epochs: 60
  batch_size: 256
  lr: 0.001
  weight_decay: 0.0
mlp_baseline:
  hidden: 64
  epochs: 60
decision:
  dt: 0.05
  ego_speed: 28.0
  cutter_speed: 18.0
  crossing_gap_m: 14.0   # bumper gap at lane-line crossing (main scenario)
  sweep_gaps_m: [14.0, 10.0, 7.0]
  demo_gap_m: 7.0        # aggressive cut-in used for the rendered GIF
  reaction_delay_s: 0.4
  max_decel: 9.0
  comfort_decel: 3.5
  trigger_prob: 0.6
  trigger_frames: 6         # debounce: posterior must stay above trigger for 6 consecutive frames (0.3 s)
  prior_lane_change: 0.05   # P(LLC)=P(RLC)=0.05 in the closed-loop sim (rare in real traffic); classifier eval uses balanced prior
  n_monte_carlo: 200
